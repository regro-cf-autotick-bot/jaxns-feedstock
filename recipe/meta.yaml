{% set name = "jaxns" %}
{% set version = "3.0.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/jaxns-{{ version }}.tar.gz
  sha256: aeed4432fa2337a4a84530a806eddedd86e6fd0a7491a23073ac2d5228efc74c

build:
  noarch: python
  number: 0

requirements:
  host:
    - setuptools >=61.0
    - pip
    - python {{ python_min }}
    - wheel
  run:
    - jax >=0.6.0
    - numpy
    - matplotlib-base
    - python >={{ python_min }}
    - scipy
    - tensorflow-probability

test:
  imports:
    - jaxns
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://jaxns.readthedocs.io/en/latest/
  dev_url: https://github.com/Joshuaalbert/jaxns
  summary: Nested Sampling in JAX
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - awvwgk
